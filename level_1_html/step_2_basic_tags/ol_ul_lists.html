<!DOCTYPE html>
<html lang="en">
  <head>
    <title> Making Lists </title>
  </head>
  <body>
    <p> I like these things: </p>
    <ul style="list-style-type: square;">
      <li> English </li>
      <li> Coding </li>
    </ul>

    <p> What should I do today </p>
    <ul>
      <li> The morning
        <ol>
          <li> English </li>
          <li> Coding </li>
          <li> Do exercise </li>
        </ol>
      </li>

      <li> The evening
        <ol>
          <li> English </li>
          <li> Coding </li>
          <li> SAT </li>
          <li> 3D-modeling </li>
        </ol>
      </li>
    </ul>
  </body>
</html>
