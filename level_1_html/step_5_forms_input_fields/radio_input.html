<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>page with a radio input</title>
</head>
 <body>
        <form action="/submit" method="get">
            <p> Выберите цвет конверта: </p>
            <div>
                <label for="white">
                    Белый конверт
                </label>
                <input type="radio" id="white" name="envelope" />
            </div>
            <div>
                <label for="green">
                    Зелёный конверт
                </label>
                <input type="radio" id="green" name="envelope" />
            </div>
            <div>
                <label for="red">
                    Красный конверт
                </label>
                <input type="radio" id="red" name="envelope" />
            </div>
            <button type="submit"> Отправить </button>
        </form>
 </body>
</html>
