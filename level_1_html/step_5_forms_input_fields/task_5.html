<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Опрос: Ваши хобби</title>
</head>
<body>
<h2>Какие у вас хобби? (можно выбрать несколько)</h2>
<form>

  <input type="checkbox" id="reading" name="hobby_reading" value="reading"/>
  <label for="reading">
    Чтение
  </label>


  <input type="checkbox" id="sport" name="hobby_sport" value="sport" checked/>
  <label for="sport">
    Спорт
  </label>


  <input type="checkbox" id="music" name="hobby_music" value="music" />
  <label for="music">
    Музыка
  </label>

  <button type="submit">Сохранить выбор</button>


</form>

</body>
</html>
