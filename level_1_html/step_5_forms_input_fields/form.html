<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>page with a form</title>
</head>
<body>
<form action="/submit" method="get">

  <div>
    <label for="name">
      Введите имя:
    </label>
    <input type="text" id="name" name="user_name"/>
  </div>

  <div>
    <label for="birth">
      Введите дату рождения:
    </label>
    <input type="date" id="birth" name="user_birth"/>
  </div>
  <button type="submit">Отправить</button>
</form>

</body>
</html>
