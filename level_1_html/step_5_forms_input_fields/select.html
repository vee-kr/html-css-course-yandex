<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>page with a textarea with tag select</title>
</head>
<body>

<p>
    <label for="assortment">
        Выберите тип открытки:
    </label>


    <select id="assortment" >
        <option value="cat">Открытка с котиком</option>
        <option value="dog">Открытка с песиком</option>
    </select>

</p>

<p>

    <label for="gift">
        Выберите подарок:
    </label>


    <select id="gift" multiple>
        <option value="flowers">Цветы</option>
        <option value="candies">Конфеты</option>
        <option value="parfum">Духи</option>
    </select>

</p>

</body>
</html>
