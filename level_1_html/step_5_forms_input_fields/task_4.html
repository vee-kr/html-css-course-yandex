<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Опрос: Любимый цвет</title>
</head>
<body>
<h2> Какой ваш любимый цвет? </h2>
<form>

    <input type="radio" id="red" name="favorite_color" value="red"/>
    <label for="red">
        Красный
    </label>



    <input type="radio" id="green" name="favorite_color" value="green" checked/>
    <label for="green">
        Зеленый
    </label>


    <input type="radio" id="blue" name="favorite_color" value="blue"/>
    <label for="blue">
       Синий
    </label>

    <button type="submit">Проголосовать</button>

</form>

</body>
</html>
