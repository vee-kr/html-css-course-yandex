<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа</title>
</head>
<body>
<form>
    <fieldset>

        <legend>
            Личные данные
        </legend>

        <label for="name">
            Ваше имя
        </label>
        <input type="text" id="name" name="full_name" required/>

        <label for="email">
            Email
        </label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required/>

        <label for="phone">
            Телефон
        </label>
        <input type="text" id="phone" name="phone"/>


    </fieldset>

    <fieldset>
        <h2>Выберите товар:</h2>

        <select name="product_id">
            <option value="model_x" selected>Смартфон Model X</option>
            <option value="probook_z">Ноутбук ProBook Z</option>
            <option value="soundwave">Наушники SoundWave</option>

        </select>

    </fieldset>

    <fieldset>
        <legend>
            Дополнительно
        </legend>

        <input type="checkbox" id="gift" name="gift_wrap" checked/>

        <label for="gift">
            Подарочная упаковка
        </label>


        <input type="checkbox" id="garantee" name="extended_warranty" checked/>

        <label for="garantee">
            Расширенная гарантия
        </label>



    </fieldset>

     <label for="comment">
            Ваш комментарий:
        </label>
        <textarea id="comment"  name="comment"></textarea>

    <button type="submit">Оформить заказ</button>
    <button type="reset">Очистить форму</button>








</form>

</body>
</html>
