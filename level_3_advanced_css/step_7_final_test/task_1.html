<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма обратной связи</title>
</head>
<body>
<form>
    <fieldset>
        <legend>Ваши личные данные</legend>
        <div>
            <label for="name-field">Имя:</label>
            <input type="text" name="user_name" id="name-field">
        </div>

        <div>
            <label for="email-field">Email:</label>
            <input type="email" name="user_email" id="email-field" placeholder="Введите вашу почту">
        </div>
    </fieldset>


    <fieldset>
        <legend>Тема обращения</legend>
        <div>
             <label>
             <input type="radio" name="topic" value="suggestion" checked>
                 Предложение
             </label>


        </div>
       <div>
           <label>
               <input type="radio" name="topic" value="complaint">
               Жалоба
           </label>


       </div>

        <div>
            <label>
                <input type="radio" name="topic" value="praise" >
                Благодарность
            </label>


        </div>


    </fieldset>







    <div>
        <label for="message">Сообщение:</label>
    </div>
    <textarea id="message" name="message"></textarea>

    <div>
    <label>
        <input type="checkbox" name="subscribe" value="yes" id="">
        Подписаться на рассылку
    </label>
        </div>

    <label for="department">В какой отдел:</label>
    <select name="department" id="department">
        <option value="support">Служба поддержки</option>
        <option value="sales" selected>Отдел продаж</option>
        <option value="management">Руководство</option>
    </select>

    <div>
    <button type="submit">Отправить</button>
    <button type="reset">Очистить</button>
        </div>
</form>

</body>
</html>
